name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_NAME: alpha-backstage
  GITOPS_REPO: alpha-gitops
  GITOPS_PATH: infrastructure/backstage

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc
      - run: yarn build:all

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'

  build:
    name: Build & Push
    needs: [test, scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc && yarn build:all
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Compute image tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi
      - name: Build and push multi-arch image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.ci \
            -t ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --push .

  deploy-staging:
    name: Deploy (staging)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Update GitOps repo (staging)
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone --depth=1 --branch=main \
            https://x-access-token:${GITOPS_TOKEN}@github.com/${{ github.repository_owner }}/${GITOPS_REPO}.git
          cd ${GITOPS_REPO}
          sed -i "s|tag:.*|tag: \"${IMAGE_TAG}\"|" ${GITOPS_PATH}/values-staging.yaml
          git config user.email "ci@alpha.ellanes.com"
          git config user.name "GitHub Actions"
          git add ${GITOPS_PATH}/values-staging.yaml
          git commit -m "chore: update alpha-backstage to ${IMAGE_TAG} in staging"
          git push

  deploy-prod:
    name: Deploy (prod)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
      - name: Update GitOps repo (prod)
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone --depth=1 --branch=main \
            https://x-access-token:${GITOPS_TOKEN}@github.com/${{ github.repository_owner }}/${GITOPS_REPO}.git
          cd ${GITOPS_REPO}
          sed -i "s|tag:.*|tag: \"${IMAGE_TAG}\"|" ${GITOPS_PATH}/values-prod.yaml
          git config user.email "ci@alpha.ellanes.com"
          git config user.name "GitHub Actions"
          git add ${GITOPS_PATH}/values-prod.yaml
          git commit -m "chore: update alpha-backstage to ${IMAGE_TAG} in prod"
          git push
